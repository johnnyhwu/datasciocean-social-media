# Stage 2 所有可調參數。腳本讀這份；改數字不用動程式。
# 標「實作新增」的是原規格沒列、實作時補的；標「待人確認」的是初稿。

slides_max: 10
title_max_lines: 2
title_precheck_chars: 15            # 封面另設
cover_title_precheck_chars: 16      # 實作新增
body_chars: [40, 60]                # 文字張補充；圖表版型一行（check_a 另設 24 字預檢）
caption_first_sentence_max_chars: 50   # 暫定，待手機預覽後調整
caption_per_slide_summary: true
caption_nav_line_mode: article_title   # 可改 search_term（見 references/threads-and-caption.md）
hashtags_max: 5
thread_body_max_chars: 500
thread_desc_overlap_max: 0.40
hook_candidates: [5, 6]         # 2026-10-06 改：自己先提 5～6 個大膽候選（見 references/hooks.md）
hook_min_styles: 3
review_max_rounds: 3
min_stock: 7
lang: zh-TW
structure_text_max_chars: 12        # 實作新增（待人確認）：「結構」區塊字數上限
# 比較詞與全稱詞詞表。出現在貼文卻不在引用主張原文中就退回
comparative_words: [更, 最, 都, 全, 幾乎, 常常, 總是, 從不, 沒贏, 遠不如, 大幅, 完全, 一定]
# 中文 AI 腔黑名單：初稿（待人確認增刪）
ai_tone_blacklist: [讓我們, 總而言之, 值得注意的是, 深入探討, 在當今, 賦能, 不僅僅, 不容忽視, 揭開, 一探究竟, 綜上所述]
render:
  width: 1080
  height: 1350
  safe_x: 40
  pad_x: 80
  min_font_px: 28
  min_contrast: 4.5
