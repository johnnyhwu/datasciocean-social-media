# Stage 2 所有可調參數。腳本讀這份；改數字不用動程式。
# 標「實作新增」的是原規格沒列、實作時補的；標「待人確認」的是初稿。

slides_max: 20                       # 2026-10-11 人決定：不再受限於 10 張，最多 20 張（2026-10-12 實測 IG API 建立 container 可到 20 個子項；實發最多 19 張成功）
title_max_lines: 2
title_precheck_chars: 15            # 封面另設
cover_title_precheck_chars: 16      # 實作新增
body_chars: [40, 110]               # 文字張補充（2026-10-08 由 [40,60] 放寬：資訊密度太低，約 5 行）
chart_body_max_chars: 110           # 圖表與對照表的補充（2026-10-08：圖與表會依補充行數往下讓位，最多約 5 行；原本 1 行 24 字）
diagram_body_max_chars: 130         # 示意圖版型的補充（2026-10-11 新增；圖會依補充行數往下讓位）
latin_allow: [Agent, Skill]   # 2026-10-12：圖上這些泛用詞不必被引用的主張涵蓋（人決定用「目標 Agent」「Skill」的說法；skillopt 第 2、3 則的卡沒有這兩個字）
context_body_max_chars: 140         # 脈絡張補充（原本 90）
caption_first_sentence_max_chars: 50   # 暫定，待手機預覽後調整
caption_per_slide_summary: true
caption_nav_line_mode: article_title   # 可改 search_term（見 references/threads-and-caption.md）
hashtags_max: 5
thread_body_max_chars: 500
thread_desc_overlap_max: 0.40
diagram_text_overlap_hint: 0.40       # 2026-10-18：示意圖文字與同張標題＋補充的二連詞重疊率超過就 HINT（圖只是重述文字）
hook_candidates: [5, 6]         # 2026-10-06 改：自己先提 5～6 個大膽候選（見 references/hooks.md）
hook_min_styles: 3
review_max_rounds: 3
min_stock: 7
lang: zh-TW
structure_text_max_chars: 12        # 實作新增（待人確認）：「結構」區塊字數上限
# 比較詞與全稱詞詞表。出現在貼文卻不在引用主張原文中就退回
comparative_words: [更, 最, 都, 全, 幾乎, 常常, 總是, 從不, 沒贏, 遠不如, 大幅, 完全, 一定]
# 中文 AI 腔黑名單：初稿（待人確認增刪）
ai_tone_blacklist: [讓我們, 總而言之, 值得注意的是, 深入探討, 在當今, 賦能, 不僅僅, 不容忽視, 揭開, 一探究竟, 綜上所述, 文章沒有, 文章沒提, 卡上沒有, 沒有給數字, 宏觀層級]   # 2026-10-12 加後五個：交代資料缺口／文縐縐（人的回饋）
# 系列貼文裡容易被讀成「這則的後面幾頁」的說法（2026-10-15 人的回饋）：改寫成「此系列的後續 post」
ambiguous_forward_refs: [系列後面, 後面會再細講, 後面再細講, 後面幾則, 後面幾張, 後面幾頁, 後面的 post, 後面的貼文]
render:
  width: 1080
  height: 1350
  safe_x: 40
  pad_x: 80
  min_font_px: 28
  min_contrast: 4.5
